appId: org.sharpforge.ide
productName: Cairn IDE
copyright: Copyright © 2026 SharpForge Contributors

directories:
  output: release
  buildResources: resources

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  target:
    - target: default
      arch:
        - arm64
        - x64
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Visual Studio Solution
        CFBundleTypeExtensions:
          - sln
          - slnx
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner

dmg:
  title: Cairn IDE
  icon: resources/icon.png
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

files:
  - dist/**/*
  - electron-main.cjs
  - preload.cjs
  - desktop/**/*
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - bin/netcoredbg/**/*
  - resources/icon.png
  - package.json

asarUnpack:
  - node_modules/node-pty/**/*
  - bin/netcoredbg/**/*

extraResources:
  - from: tools/semantic
    to: semantic
    filter:
      - "*.cs"
      - "*.csproj"
